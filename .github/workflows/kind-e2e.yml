name: Kind end-to-end

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: azure/setup-kubectl@v4
      - run: |
          mkdir -p .tools
          curl -Lo .tools/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-arm64
          chmod +x .tools/kind
      - run: ./scripts/run-kind-e2e.sh
      - if: always()
        run: docker compose down --volumes --remove-orphans
