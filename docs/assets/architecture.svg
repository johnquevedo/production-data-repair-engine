<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Production Data Repair Engine architecture</title>
  <desc id="desc">Payments flow through PostgreSQL and Kafka lineage into Spark discovery, planning, parallel repair, validation, audit, and rollback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#101b32"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#72d5ff"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <text x="60" y="66" fill="#f7fbff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Online repair with PostgreSQL as the safety boundary</text>
  <text x="60" y="98" fill="#9fb2ca" font-family="Inter,Arial,sans-serif" font-size="16">Immutable provenance → reviewed plan → idempotent mutation → validation or compensation</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <g transform="translate(60 150)">
      <rect width="190" height="110" rx="14" fill="#162640" stroke="#3d6ea3"/>
      <text x="20" y="35" fill="#78e3b5" font-size="15" font-weight="700">LIVE PAYMENTS</text>
      <text x="20" y="65" fill="#fff" font-size="18">Capture · Refund</text>
      <text x="20" y="90" fill="#a9bdd3" font-size="14">fees + balanced ledger</text>
    </g>
    <g transform="translate(310 150)">
      <rect width="190" height="110" rx="14" fill="#162640" stroke="#3d6ea3"/>
      <text x="20" y="35" fill="#ffca70" font-size="15" font-weight="700">CDC + LINEAGE</text>
      <text x="20" y="65" fill="#fff" font-size="18">Postgres → Kafka</text>
      <text x="20" y="90" fill="#a9bdd3" font-size="14">code/config/tx/offset</text>
    </g>
    <g transform="translate(560 150)">
      <rect width="190" height="110" rx="14" fill="#162640" stroke="#3d6ea3"/>
      <text x="20" y="35" fill="#b29cff" font-size="15" font-weight="700">DISCOVER + PLAN</text>
      <text x="20" y="65" fill="#fff" font-size="18">Spark + dry run</text>
      <text x="20" y="90" fill="#a9bdd3" font-size="14">before/after + SHA-256</text>
    </g>
    <g transform="translate(810 150)">
      <rect width="190" height="110" rx="14" fill="#162640" stroke="#3d6ea3"/>
      <text x="20" y="35" fill="#72d5ff" font-size="15" font-weight="700">PARALLEL REPAIR</text>
      <text x="20" y="65" fill="#fff" font-size="18">SKIP LOCKED + CAS</text>
      <text x="20" y="90" fill="#a9bdd3" font-size="14">keys + checkpoints</text>
    </g>
    <g transform="translate(935 340)">
      <rect width="205" height="110" rx="14" fill="#16352f" stroke="#56d09d"/>
      <text x="20" y="35" fill="#78e3b5" font-size="15" font-weight="700">COMMIT</text>
      <text x="20" y="65" fill="#fff" font-size="18">Valid invariants</text>
      <text x="20" y="90" fill="#b7d8cc" font-size="14">append-only audit</text>
    </g>
    <g transform="translate(655 340)">
      <rect width="205" height="110" rx="14" fill="#40232a" stroke="#ff7c91"/>
      <text x="20" y="35" fill="#ff9bad" font-size="15" font-weight="700">COMPENSATE</text>
      <text x="20" y="65" fill="#fff" font-size="18">Validation failed</text>
      <text x="20" y="90" fill="#e2b7bf" font-size="14">automatic rollback</text>
    </g>
  </g>
  <g fill="none" stroke="#72d5ff" stroke-width="3" marker-end="url(#arrow)">
    <path d="M250 205 H300"/>
    <path d="M500 205 H550"/>
    <path d="M750 205 H800"/>
    <path d="M1000 205 C1080 205 1080 330 1040 330"/>
    <path d="M905 260 C905 310 810 310 790 330"/>
  </g>
  <text x="60" y="400" fill="#9fb2ca" font-family="Inter,Arial,sans-serif" font-size="14">Concurrent writes continue</text>
  <path d="M60 420 H585" stroke="#78e3b5" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="60" y="462" fill="#f7fbff" font-family="Inter,Arial,sans-serif" font-size="15">Row versions reject stale plans without clobbering legitimate payment activity.</text>
</svg>
